name: Build Secret Rooms

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build the mod JAR and its required classes/resources without running
      # the entire Gradle lifecycle (including unrelated checks).
      - name: Build mod JAR
        run: ./gradlew jar --no-daemon --stacktrace --console=plain

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: secretroomsmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
